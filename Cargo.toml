[workspace]
members = ["crates/peazip-core", "crates/peazip-native", "crates/peazip-ui", "crates/peazip-web", "crates/peazip-worker"]
resolver = "2"

[profile.web]
inherits = "release"
opt-level = "z"
lto = "thin"
strip = true
panic = "abort"

[profile.web.package.peazip-worker]
strip = "debuginfo"
