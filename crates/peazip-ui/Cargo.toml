[package]
name = "peazip-ui"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false

[dependencies]
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf-dfa", "perf-literal", "unicode"] }
peazip-core = { path = "../peazip-core" }
nsh-core = { git = "https://github.com/longbridge/nsh.git", rev = "701bdcee9512e0f6aed39042d1fe24564dcd0b43", default-features = false }
nsh-base = { git = "https://github.com/longbridge/nsh.git", rev = "701bdcee9512e0f6aed39042d1fe24564dcd0b43", default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
peazip-native = { path = "../peazip-native" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
futures-channel = "0.3"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL", "NSObject", "NSNotification", "NSPathUtilities"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = ["std", "UIApplication", "UIView", "UIViewController"] }
dispatch2 = "0.3.1"
libc = "0.2"
futures-channel = "0.3"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/longbridge/nsh.git", rev = "701bdcee9512e0f6aed39042d1fe24564dcd0b43", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/longbridge/nsh.git", rev = "701bdcee9512e0f6aed39042d1fe24564dcd0b43", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { git = "https://github.com/longbridge/nsh.git", rev = "701bdcee9512e0f6aed39042d1fe24564dcd0b43", default-features = false }

[dev-dependencies]
libc = "0.2"
tempfile = "3"
nsh-engine = { git = "https://github.com/longbridge/nsh.git", rev = "701bdcee9512e0f6aed39042d1fe24564dcd0b43", default-features = false }
nsh-testing = { git = "https://github.com/longbridge/nsh.git", rev = "701bdcee9512e0f6aed39042d1fe24564dcd0b43", default-features = false }
