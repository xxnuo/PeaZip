[package]
name = "peazip-native"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false

[dependencies]
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
peazip-core = { path = "../peazip-core" }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
