[package]
name = "peazip-core"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
publish = false

[dependencies]
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
tar = { version = "0.4", default-features = false }
# The bounded central-directory reader is currently an unstable API.
zip = { version = "=9.4.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
