name: Rust rewrite

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p peazip-core -p peazip-native -p peazip-worker --locked
      - run: cargo clippy -p peazip-core -p peazip-native -p peazip-worker --all-targets --locked -- -D warnings
  web-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked --root target/web-tools
      - run: uv run python scripts/build_web.py
      - run: cargo clippy -p peazip-web -p peazip-worker --target wasm32-unknown-unknown --locked --no-deps -- -D warnings
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test
      - uses: actions/upload-artifact@v4
        with:
          name: peazip-web
          path: target/web-dist/
  desktop-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xvfb xauth dbus-x11 xdotool imagemagick tesseract-ocr fonts-noto-cjk p7zip-full
      - run: cargo test -p peazip-ui --locked
      - run: cargo clippy -p peazip-ui --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo build -p peazip-ui --locked && bash scripts/smoke_linux.sh target/debug/peazip-ui target/linux-smoke
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_filesystem.sh target/debug/peazip-ui target/linux-filesystem
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_create_options.sh target/debug/peazip-ui target/linux-create-options
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_create_formats.sh target/debug/peazip-ui target/linux-create-formats
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_extract_options.sh target/debug/peazip-ui target/linux-extract-options
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_packed.sh target/debug/peazip-ui target/linux-packed
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_filter.sh target/debug/peazip-ui target/linux-filter
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_new_folder.sh target/debug/peazip-ui target/linux-new-folder
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_copy_selected.sh target/debug/peazip-ui target/linux-copy-selected
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_columns.sh target/debug/peazip-ui target/linux-columns
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: peazip-linux-smoke
          path: |
            target/linux-smoke/
            target/linux-filesystem/
            target/linux-create-options/
            target/linux-create-formats/
            target/linux-extract-options/
            target/linux-packed/
            target/linux-filter/
            target/linux-new-folder/
            target/linux-copy-selected/
            target/linux-columns/
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: astral-sh/setup-uv@v6
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;29.0.13113456'
      - run: uv run python scripts/check_android_bridge.py
      - run: uv run python scripts/build_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: peazip-android-debug
          path: target/android/arm64-v8a/peazip-arm64-v8a-debug.apk
  ios-simulator-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: astral-sh/setup-uv@v6
      - run: uv run python scripts/build_ios.py --target aarch64-apple-ios-sim
      - name: Launch on a dedicated iOS simulator
        run: |
          read -r ios_smoke_runtime ios_smoke_type < <(xcrun simctl list runtimes -j | uv run python -c 'import json,sys; r=next(r for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r.get("platform")=="iOS"); t=next(t for t in r["supportedDeviceTypes"] if t.get("productFamily")=="iPhone"); print(r["identifier"],t["identifier"])')
          ios_smoke_udid=$(xcrun simctl create PeaZip-CI "$ios_smoke_type" "$ios_smoke_runtime")
          trap 'xcrun simctl delete "$ios_smoke_udid"' EXIT
          xcrun simctl boot "$ios_smoke_udid"
          uv run python scripts/smoke_ios.py --udid "$ios_smoke_udid" --output target/ios-smoke
          uv run python scripts/ios_ui_smoke.py --udid "$ios_smoke_udid" --device-name PeaZip-CI --app target/ios/aarch64-apple-ios-sim/release/PeaZip.app --out target/ios-ui-smoke
      - run: ditto -c -k --sequesterRsrc --keepParent target/ios/aarch64-apple-ios-sim/release/PeaZip.app target/ios/PeaZip-simulator.zip
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peazip-ios-simulator
          path: |
            target/ios/PeaZip-simulator.zip
            target/ios-smoke/
            target/ios-ui-smoke/manifest.json
            target/ios-ui-smoke/Smoke.xcresult/
            target/ios-ui-smoke/*.log
            target/ios-ui-smoke/final.png
  upstream-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m unittest discover -s scripts -p 'test_*.py'
      - run: git fetch https://github.com/peazip/PeaZip.git sources
      - run: uv run python scripts/upstream_report.py --target FETCH_HEAD > upstream-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-report
          path: upstream-report.json
