name: Rust rewrite

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p peazip-core -p peazip-native -p peazip-worker --locked
      - run: cargo clippy -p peazip-core -p peazip-native -p peazip-worker --all-targets --locked -- -D warnings
  web-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked --root target/web-tools
      - run: uv run python scripts/build_web.py
      - run: cargo clippy -p peazip-web -p peazip-worker --target wasm32-unknown-unknown --locked --no-deps -- -D warnings
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - run: pnpm --dir web test
      - uses: actions/upload-artifact@v4
        with:
          name: peazip-web
          path: target/web-dist/
  desktop-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libx11-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xvfb xauth dbus-x11 xdotool imagemagick tesseract-ocr fonts-noto-cjk p7zip-full
      - run: cargo test -p peazip-ui --locked
      - run: cargo clippy -p peazip-ui --all-targets --locked -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo build -p peazip-ui --locked && bash scripts/smoke_linux.sh target/debug/peazip-ui target/linux-smoke
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_filesystem.sh target/debug/peazip-ui target/linux-filesystem
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_double_click.sh target/debug/peazip-ui target/linux-double-click
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_create_options.sh target/debug/peazip-ui target/linux-create-options
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_create_formats.sh target/debug/peazip-ui target/linux-create-formats
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_extract_options.sh target/debug/peazip-ui target/linux-extract-options
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_packed.sh target/debug/peazip-ui target/linux-packed
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_filter.sh target/debug/peazip-ui target/linux-filter
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_new_folder.sh target/debug/peazip-ui target/linux-new-folder
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_copy_selected.sh target/debug/peazip-ui target/linux-copy-selected
      - if: runner.os == 'Linux'
        run: bash scripts/smoke_linux_columns.sh target/debug/peazip-ui target/linux-columns
      - if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: peazip-linux-smoke
          path: |
            target/linux-smoke/
            target/linux-filesystem/
            target/linux-double-click/
            target/linux-create-options/
            target/linux-create-formats/
            target/linux-extract-options/
            target/linux-packed/
            target/linux-filter/
            target/linux-new-folder/
            target/linux-copy-selected/
            target/linux-columns/
  upstream-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m unittest discover -s scripts -p 'test_*.py'
      - run: git fetch https://github.com/peazip/PeaZip.git sources
      - run: uv run python scripts/upstream_report.py --target FETCH_HEAD > upstream-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-report
          path: upstream-report.json
