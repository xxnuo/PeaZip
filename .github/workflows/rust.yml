name: Rust rewrite

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test -p peazip-core -p peazip-native -p peazip-worker --locked
      - run: cargo clippy -p peazip-core -p peazip-native -p peazip-worker --all-targets --locked -- -D warnings
  web-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '12.18.0'
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked --root target/web-tools
      - run: uv run python scripts/build_web.py
      - run: cargo clippy -p peazip-web -p peazip-worker --target wasm32-unknown-unknown --locked --no-deps -- -D warnings
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm --dir web test
      - uses: actions/upload-artifact@v4
        with:
          name: peazip-web
          path: target/web-dist/
  desktop-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: cargo test -p peazip-ui --locked
      - run: cargo clippy -p peazip-ui --all-targets --locked -- -D warnings
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: astral-sh/setup-uv@v6
      - run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0' 'ndk;29.0.13113456'
      - run: uv run python scripts/build_android.py
      - uses: actions/upload-artifact@v4
        with:
          name: peazip-android-debug
          path: target/android/arm64-v8a/peazip-arm64-v8a-debug.apk
  ios-simulator-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: astral-sh/setup-uv@v6
      - run: uv run python scripts/build_ios.py --target aarch64-apple-ios-sim
      - run: ditto -c -k --sequesterRsrc --keepParent target/ios/aarch64-apple-ios-sim/release/PeaZip.app target/ios/PeaZip-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: peazip-ios-simulator
          path: target/ios/PeaZip-simulator.zip
  upstream-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv run python -m unittest discover -s scripts -p 'test_*.py'
      - run: git fetch https://github.com/peazip/PeaZip.git sources
      - run: uv run python scripts/upstream_report.py --target FETCH_HEAD > upstream-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-report
          path: upstream-report.json
